name: CI-CD

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]
  workflow_dispatch:   # 수동 실행도 활성

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name : gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: gradle 의존성 캐시 세팅 (빌드 속도 향상)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 (JAR 생성)
        run: ./gradlew clean bootJar -Dspring.profiles.active=test

      - name: JAR 경로 추출
        id: jar
        run: |
          JAR=$(ls -t build/libs/*.jar | grep -v '\-plain\.jar' | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"

      - name: 아티팩트 업로드 (app-jar)
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error

  deploy-eb:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch')
    concurrency: # 마지막 커밋만 배포
      group: eb-deploy-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: JAR 아티팩트 다운로드 (bundle에)
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: bundle

      - name: EB용 번들로 만들기(zip)
        run: |
          mv bundle/*.jar bundle/application.jar
          echo "web: java -jar application.jar" > bundle/Procfile
          cd bundle && zip -r ../deploy.zip . && cd ..

      - name: AWS 로그인 (깃헙 시크릿 사용)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: 실제 배포
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: v-${{ github.run_number }}-${{ github.sha }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: deploy.zip

